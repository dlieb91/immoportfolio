<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImmoPortfolio</title>

<!-- Web-App: auf dem iPad Voraussetzung dafuer, dass Safari den Speicher
     nicht nach sieben Tagen loescht (siehe js/speicher/lokal.js). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ImmoPortfolio">
<link rel="apple-touch-icon" href="bilder/icon-180.png">

<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-130 -130 260 260'><circle r='125' fill='%2314213D'/><polygon points='0,-104 20,-14 0,-2 -20,-14' fill='%23C9A227'/><polygon points='0,96 16,-2 0,-14 -16,-2' fill='%23F7F5F0'/><circle r='13' fill='%231B2B4A'/></svg>">
</head>
<body>

<!-- Kompass einmal definiert, per <use> an beiden Stellen eingesetzt -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="zkBlau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4F78"/><stop offset="100%" stop-color="#1B2B4A"/>
    </linearGradient>
    <linearGradient id="zkDunkel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/><stop offset="100%" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="zkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C567"/><stop offset="100%" stop-color="#B98F1E"/>
    </linearGradient>
    <linearGradient id="zkNadel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D98C"/><stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7A15"/>
    </linearGradient>
    <symbol id="zkKompass" viewBox="-130 -130 260 260">
      <circle cx="0" cy="0" r="118" fill="#EDEAE1"/>
      <g opacity="0.8">
        <polygon points="0,0 58,-58 8,-8" fill="url(#zkGold)"/>
        <polygon points="0,0 58,-58 -8,-8" fill="#8F6E17"/>
        <polygon points="0,0 58,58 8,8" fill="#8F6E17"/>
        <polygon points="0,0 58,58 -8,8" fill="url(#zkGold)"/>
        <polygon points="0,0 -58,58 -8,8" fill="url(#zkGold)"/>
        <polygon points="0,0 -58,58 8,8" fill="#8F6E17"/>
        <polygon points="0,0 -58,-58 -8,-8" fill="#8F6E17"/>
        <polygon points="0,0 -58,-58 8,-8" fill="url(#zkGold)"/>
      </g>
      <polygon points="0,-98 12,-10 0,0" fill="url(#zkBlau)"/>
      <polygon points="0,-98 -12,-10 0,0" fill="url(#zkDunkel)"/>
      <polygon points="98,0 10,12 0,0" fill="url(#zkBlau)"/>
      <polygon points="98,0 10,-12 0,0" fill="url(#zkDunkel)"/>
      <polygon points="0,98 -12,10 0,0" fill="url(#zkBlau)"/>
      <polygon points="0,98 12,10 0,0" fill="url(#zkDunkel)"/>
      <polygon points="-98,0 -10,-12 0,0" fill="url(#zkBlau)"/>
      <polygon points="-98,0 -10,12 0,0" fill="url(#zkDunkel)"/>
      <circle cx="0" cy="0" r="10" fill="#1B2B4A"/>
      <circle cx="-3" cy="-3" r="4" fill="#4A5F8C"/>
      <g transform="rotate(22.5)">
        <polygon points="0,-118 13,-14 0,-4 -13,-14" fill="url(#zkNadel)"/>
        <polygon points="0,52 10,-4 0,-14 -10,-4" fill="#F7F5F0" stroke="#14213D" stroke-width="6"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="app" class="app" hidden>
  <!-- Verdunkelt den Inhalt, solange die Schublade offen ist -->
  <div id="navSchatten" class="nav-schatten"></div>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" title="Zahlenkompass">
        <svg role="img" aria-label="Zahlenkompass"><use href="#zkKompass"/></svg>
      </div>
      <div class="brand-text">
        <strong>ImmoPortfolio</strong>
        <span>Zahlenkompass</span>
      </div>
    </div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-foot">
      <button id="themeToggle" class="icon-btn" title="Hell / Dunkel umschalten" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Ansicht</span>
      </button>
      <!-- Text wird beim Start aus den Daten gesetzt, siehe chromeAktualisieren -->
      <div class="version" id="version"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <!-- Nur auf schmalen Geräten sichtbar, siehe .nav-knopf im CSS -->
        <button id="btnNav" class="icon-btn nav-knopf" type="button" title="Menü" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="viewTitle">Dashboard</h1>
        <span id="portfolioName" class="pill"></span>
      </div>
      <div class="topbar-right">
        <div id="steuerModus" class="seg seg-sm" title="Betrachtung vor oder nach Steuern"></div>
        <div id="saveStatus" class="save-status" title="Speicherstatus">
          <span class="dot"></span><span class="label">Gespeichert</span>
        </div>
        <!-- Nur bei Dropbox sichtbar, siehe abgleichAnbinden in main.js -->
        <button id="syncStatus" class="save-status sync-status" type="button" title="Mit Dropbox abgleichen" hidden>
          <span class="dot"></span><span class="label"></span>
        </button>
        <button id="btnFolder" class="btn btn-ghost" type="button" title="Speicherort anzeigen">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span id="folderName">Ordner</span>
        </button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>
</div>

<div id="startup" class="startup">
  <div class="startup-card">
    <div class="startup-logo">
      <svg role="img" aria-label="Zahlenkompass"><use href="#zkKompass"/></svg>
    </div>
    <h1>ImmoPortfolio</h1>
    <div class="startup-marke">Zahlenkompass</div>
    <div class="startup-claim">Klarheit für deine Zahlen</div>
    <p class="startup-sub">Übersicht, Kennzahlen und Prognose für dein Immobilien-Investment.</p>
    <div id="startupBody" class="startup-body">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
